<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">One Flow, Two Notions of Quality</title>
<desc id="desc">Sampling Budgets for Image Inpainting. A controlled study of pixel fidelity, perceptual similarity, and inference cost. The geometric motif is decorative, not an experimental reconstruction.</desc>
